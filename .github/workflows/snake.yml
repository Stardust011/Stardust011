name: Snake

# 仅定时 + 手动触发
on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Shanghai
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # 只读公开贡献数据，内置 GITHUB_TOKEN 足够
      # v3 大版本标签自动跟踪 3.x 最新
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Stardust011
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#EFB752

      # 产物推送到 output 分支，供 README 以 raw 链接引用
      # v5 大版本标签自动跟踪 5.x 最新
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore(snake): update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
